<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A warm, stylish welcome page." />
    <title>Hi, Hello, Welcome!</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f8f7ff;
        --muted: #c9c5df;
        --purple: #9d7cff;
        --pink: #ff79c6;
        --cyan: #67e8f9;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        background: #100d20;
      }

      .orb {
        position: absolute;
        width: 36rem;
        aspect-ratio: 1;
        border-radius: 50%;
        filter: blur(4px);
        opacity: .65;
        animation: drift 12s ease-in-out infinite alternate;
      }
      .orb.one { background: #5b2bd6; top: -19rem; left: -12rem; }
      .orb.two { background: #d52c8a; bottom: -22rem; right: -11rem; animation-delay: -6s; }

      main {
        position: relative;
        width: min(92vw, 760px);
        padding: clamp(2.4rem, 7vw, 5.5rem);
        text-align: center;
        border: 1px solid rgba(255,255,255,.2);
        border-radius: 32px;
        background: rgba(26, 21, 52, .63);
        box-shadow: 0 28px 80px rgba(0,0,0,.35), inset 0 1px rgba(255,255,255,.13);
        backdrop-filter: blur(18px);
        animation: rise .8s cubic-bezier(.2,.8,.2,1) both;
      }

      .sparkle { color: var(--cyan); font-size: 1.35rem; }
      .eyebrow { margin: 0 0 1rem; color: var(--muted); font-size: .78rem; font-weight: 750; letter-spacing: .2em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(3.2rem, 10vw, 6.6rem); line-height: .91; letter-spacing: -.075em; }
      h1 span {
        display: block;
        background: linear-gradient(110deg, #fff 10%, var(--cyan) 43%, var(--pink) 80%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p { max-width: 31rem; margin: 1.8rem auto 2.25rem; color: var(--muted); font-size: clamp(1rem, 2.3vw, 1.2rem); line-height: 1.65; }
      button {
        border: 0;
        border-radius: 999px;
        padding: .95rem 1.45rem;
        color: #171026;
        background: linear-gradient(110deg, var(--cyan), #d3bbff 53%, var(--pink));
        font: inherit;
        font-weight: 800;
        cursor: pointer;
        box-shadow: 0 12px 28px rgba(151, 111, 255, .3);
        transition: transform .2s ease, box-shadow .2s ease;
      }
      button:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 18px 34px rgba(151, 111, 255, .45); }
      button:focus-visible { outline: 3px solid white; outline-offset: 4px; }
      #note { min-height: 1.5em; margin: 1.25rem 0 0; color: var(--cyan); font-weight: 650; }

      @keyframes rise { from { opacity: 0; transform: translateY(28px) scale(.97); } to { opacity: 1; transform: none; } }
      @keyframes drift { to { transform: translate(5rem, 2rem) scale(1.14); } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    </style>
  </head>
  <body>
    <div class="orb one"></div><div class="orb two"></div>
    <main>
      <div class="sparkle" aria-hidden="true">✦ ✧ ✦</div>
      <p class="eyebrow">A little corner of the internet</p>
      <h1><span>Hi.</span><span>Hello.</span><span>Welcome!</span></h1>
      <p>Glad you made it here. Take a breath, look around, and make yourself at home.</p>
      <button id="welcomeButton" type="button">Start exploring <span aria-hidden="true">→</span></button>
      <div id="note" aria-live="polite"></div>
    </main>
    <script>
      const button = document.querySelector('#welcomeButton');
      const note = document.querySelector('#note');
      button.addEventListener('click', () => {
        note.textContent = 'You are officially very welcome here. ✨';
        button.textContent = 'Welcome aboard!';
      });
    </script>
  </body>
</html>
