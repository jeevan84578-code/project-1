<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Jeevan</title>
    <style>
      :root { color-scheme:dark; --ink:#f8f7ff; --muted:#c9c5df; --cyan:#67e8f9; --pink:#ff79c6; } * { box-sizing:border-box; } body { min-height:100vh; margin:0; display:grid; place-items:center; padding:2rem; font-family:Inter,ui-sans-serif,system-ui,sans-serif; color:var(--ink); background:radial-gradient(circle at 12% 12%,#52309a,transparent 36%),radial-gradient(circle at 86% 86%,#8f245f,transparent 37%),#100d20; } main { width:min(92vw,760px); padding:clamp(2.5rem,7vw,5rem); border:1px solid rgba(255,255,255,.2); border-radius:32px; background:rgba(26,21,52,.68); box-shadow:0 28px 80px rgba(0,0,0,.35); backdrop-filter:blur(18px); } nav { display:flex; justify-content:flex-end; gap:1rem; margin-bottom:3rem; } nav a { color:var(--muted); text-decoration:none; font-weight:700; } nav a:hover,nav a[aria-current="page"] { color:var(--cyan); } .eyebrow { color:var(--cyan); font-size:.78rem; font-weight:800; letter-spacing:.18em; text-transform:uppercase; } h1 { margin:.55rem 0 1rem; font-size:clamp(2.7rem,8vw,5rem); letter-spacing:-.06em; } p { color:var(--muted); font-size:1.1rem; line-height:1.7; } form { display:grid; gap:1rem; margin-top:2rem; } input,textarea { width:100%; padding:1rem; border:1px solid rgba(255,255,255,.18); border-radius:12px; color:var(--ink); background:rgba(255,255,255,.08); font:inherit; } textarea { min-height:110px; resize:vertical; } button { justify-self:start; border:0; border-radius:999px; padding:.9rem 1.35rem; color:#171026; background:linear-gradient(110deg,var(--cyan),#d3bbff,var(--pink)); font:inherit; font-weight:800; cursor:pointer; } #message { color:var(--cyan); font-weight:700; }
    </style>
  </head>
  <body>
    <main>
      <nav aria-label="Main navigation"><a href="welcome.html">Home</a><a href="about.html">About</a><a href="contact.html" aria-current="page">Contact</a></nav>
      <div class="eyebrow">Say hello</div>
      <h1>Let's connect.</h1>
      <p>Have a question or just want to say hi? Send Jeevan a message below.</p>
      <form id="contactForm">
        <input aria-label="Your name" placeholder="Your name" required />
        <input aria-label="Your email" type="email" placeholder="Your email" required />
        <textarea aria-label="Your message" placeholder="Your message" required></textarea>
        <button type="submit">Send message →</button>
      </form>
      <p id="message" aria-live="polite"></p>
    </main>
    <script>document.querySelector('#contactForm').addEventListener('submit', event => { event.preventDefault(); document.querySelector('#message').textContent = 'Thanks — your message is ready to send! ✨'; event.currentTarget.reset(); });</script>
  </body>
</html>
